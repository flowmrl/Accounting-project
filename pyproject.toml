[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compta-pme"
version = "0.1.0"
description = "Logiciel de comptabilité révolutionnaire pour les PME françaises avec support multi-référentiels (PCG, IFRS, US GAAP…)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["comptabilité", "PCG", "IFRS", "GAAP", "PME", "accounting"]
authors = [
  { name = "Compta PME" }
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "babel>=2.16.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "rich>=13.9.0",
  "typer>=0.13.0",
  # Facture électronique Factur-X (PDF/A-3 + XML EN 16931)
  "reportlab>=4.0",
  "pypdf>=4.0",
  "lxml>=5.0",
  "cffi>=1.0",
]

[project.optional-dependencies]
prod = [
  "psycopg2-binary>=2.9",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
compta-pme = "src.cli:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  "E501",   # line too long — géré par le formateur, pas bloquant en CI
  "E741",   # ambiguous variable name (l, O, I) — fréquent en comptabilité
  "F401",   # unused imports — certains sont des side-effects intentionnels
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
