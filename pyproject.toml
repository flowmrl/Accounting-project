[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compta-pme"
version = "0.1.0"
description = "Logiciel de comptabilité révolutionnaire pour les PME françaises avec support multi-référentiels (PCG, IFRS, US GAAP…)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["comptabilité", "PCG", "IFRS", "GAAP", "PME", "accounting"]
authors = [
  { name = "Compta PME" }
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "babel>=2.16.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "rich>=13.9.0",
  "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "factory-boy>=3.3.1",
]

[project.scripts]
compta-pme = "src.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
