services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compta
      POSTGRES_PASSWORD: compta
      POSTGRES_DB: compta_pme
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compta -d compta_pme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src       # hot-reload en dev (retirer en prod)
    environment:
      DATABASE_URL: postgresql+psycopg2://compta:compta@postgres:5432/compta_pme

volumes:
  pgdata:
